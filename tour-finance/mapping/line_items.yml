# Mapping: canonical concept -> ชื่อรายการที่เป็นไปได้ในงบ SET
#
# match:
#   exact  = label หลัง .strip() ต้องตรงเป๊ะ (ใช้กับบรรทัด "รวม..." กันชนกับ subtotal)
#   prefix = label ขึ้นต้นด้วย alias (ใช้กับบรรทัดที่อาจมีสัญลักษณ์/ฯ ต่อท้าย)
#
# เพิ่ม alias ใหม่ได้เรื่อยๆ เมื่อเจอบริษัทที่ใช้ชื่อต่าง — สคริปต์จะ fail-loud
# ถ้าหา canonical ที่ required ไม่เจอ (ไม่เดา ไม่ใส่ 0 เงียบๆ)

income_statement:               # ชีต PL
  total_revenue:               # ยอด "รวมรายได้"; ถ้าเป็นงบ multi-step อาจเป็นผลรวมรายได้อื่นเท่านั้น
    match: exact
    required: true
    aliases: ["รวมรายได้", "รายได้รวม"]
  revenue_main:                # รายได้หลักบรรทัดเดียว (ใช้ตรวจงบ multi-step แบบ DUSIT)
    match: prefix
    required: false
    reduce: max                # เอาบรรทัดที่มากสุด (ไม่ใช่ผลรวม/บรรทัดแรก)
    aliases:
      - "รายได้จากการขายและการให้บริการ"
      - "รายได้จากการขายและบริการ"              # MANRIN 2564-2566 (ไม่มี "การให้")
      - "รายได้จากการประกอบกิจการโรงแรม"
      - "รายได้จากการประกอบธุรกิจโรงแรม"        # SHR 2565-2566 ("ธุรกิจ" + label ตัด 2 บรรทัด)
      - "รายได้จากกิจการโรงแรม"
      - "รายได้จากการขายอาหารและเครื่องดื่ม"
      - "รายได้จากการให้บริการ"
  cogs_subtotal:               # ถ้ามีบรรทัด "รวมต้นทุน..." ใช้ยอดรวมนี้ก่อน (ASIA)
    match: prefix
    required: false
    aliases: ["รวมต้นทุนขายและบริการ", "รวมต้นทุนขายและให้บริการ", "รวมต้นทุนขาย"]
  cogs_components:              # ไม่มี subtotal -> ผลรวมของบรรทัดเหล่านี้ (CENTEL/MINT/ERW)
    match: prefix
    required: false            # COGS required แต่พอใจด้วย subtotal หรือ components อย่างใดอย่างหนึ่ง (เช็คในโค้ด)
    sum: true
    aliases:
      - "ต้นทุนการประกอบกิจการโรงแรม"          # CENTEL
      - "ต้นทุนจากการประกอบกิจการโรงแรม"       # ERW (มี "จาก")
      - "ต้นทุนจากการประกอบธุรกิจโรงแรม"       # SHR (ธุรกิจ แทน กิจการ)
      - "ต้นทุนโดยตรงของกิจการโรงแรม"          # MINT
      - "ต้นทุนขายและบริการ"                    # OHTL (บรรทัดเดียว)
      - "ต้นทุนจากการให้บริการ"                  # SHR 2564
      - "ต้นทุนขายและการให้บริการ"              # MANRIN
      - "ต้นทุนจากการประกอบธุรกิจโรงแรมและบริการ"  # SHR (ชื่อยาว)
      - "ต้นทุนขายอาหารและเครื่องดื่ม"
      - "ต้นทุนจากการให้เช่าห้องในอาคารและค่าบริการ"  # ERW
      - "ต้นทุนจากการให้เช่า"
      - "ต้นทุนขายและบริการ"
  depreciation:                # ค่าเสื่อมราคา — บางบริษัทแยกบรรทัด (ERW), บางบริษัทฝังในต้นทุน
    match: prefix              # เก็บไว้ทดสอบ variant COGS ตอน reverse-eng (ไม่รวมใน COGS หลัก)
    required: false
    aliases: ["ค่าเสื่อมราคาและค่าตัดจำหน่าย", "ค่าเสื่อมราคา"]
  selling_admin:               # ค่าใช้จ่ายขาย+บริหาร (ใช้ตอน reverse-eng DPO)
    match: prefix
    required: false
    sum: true
    aliases: ["ค่าใช้จ่ายในการขาย", "ค่าใช้จ่ายในการบริหาร", "ค่าใช้จ่ายในการขายและบริหาร"]
  net_profit_total:            # กำไรสุทธิรวม (รวมส่วนได้เสียที่ไม่มีอำนาจควบคุม)
    match: prefix
    required: true
    aliases:
      - "กำไรสำหรับงวด"
      - "กำไรสำหรับปี"
      - "กำไร(ขาดทุน)สำหรับงวด"
      - "กำไร(ขาดทุน)สำหรับปี"
      - "ขาดทุนสำหรับงวด"                  # ไตรมาสที่ขาดทุน (DUSIT)
      - "ขาดทุนสำหรับปี"
      - "กำไร(ขาดทุน)สำหรับรอบระยะเวลา"    # MINT ('รอบระยะเวลา' แทน 'งวด')
      - "กำไรสำหรับรอบระยะเวลา"
      - "ขาดทุนสำหรับรอบระยะเวลา"
      - "(ขาดทุน)กำไรสำหรับรอบระยะเวลา"    # OHTL (วงเล็บขาดทุนนำหน้า ไตรมาสขาดทุน)
      - "(ขาดทุน)กำไรสำหรับงวด"
      - "(ขาดทุน)กำไรสำหรับปี"
      - "กำไรสุทธิ"
  net_profit_parent:           # กำไรส่วนที่เป็นของผู้ถือหุ้นบริษัทแม่ (ใช้กับ EPS/ROE มาตรฐาน)
    match: prefix
    required: false
    aliases:
      - "ส่วนที่เป็นของผู้ถือหุ้นบริษัทฯ"
      - "ส่วนที่เป็นของผู้ถือหุ้นของบริษัทฯ"
      - "ส่วนที่เป็นของผู้ถือหุ้นบริษัทใหญ่"
      - "ส่วนที่เป็นของผู้ถือหุ้นของบริษัทใหญ่"
      - "ส่วนที่เป็นของผู้เป็นเจ้าของของบริษัทใหญ่"   # MINT 2568
      - "ส่วนที่เป็นของผู้เป็นเจ้าของบริษัทใหญ่"
      - "ส่วนที่เป็นของผู้เป็นเจ้าของของบริษัท"       # MINT 2566 (บรรทัดกำไรสุทธิ ไม่มี 'ใหญ่')
      - "ส่วนที่เป็นของผู้เป็นเจ้าของบริษัท"
      - "ส่วนที่เป็นของบริษัทใหญ่"
  net_profit_minority:         # ส่วนได้เสียที่ไม่มีอำนาจควบคุม (ตรวจ: รวม = แม่ + ส่วนน้อย)
    match: prefix
    required: false
    aliases: ["ส่วนที่เป็นของส่วนได้เสียที่ไม่มีอำนาจควบคุม", "ส่วนได้เสียที่ไม่มีอำนาจควบคุม", "ส่วนที่เป็นของผู้มีส่วนได้เสียที่ไม่มีอำนาจควบคุม"]
  other_income:                # รายได้อื่น/รายได้ที่ไม่ใช่การดำเนินธุรกิจหลัก (ใช้แยกรายได้ดำเนินธุรกิจ - SET)
    match: prefix
    required: false
    sum: true
    aliases: ["รายได้อื่น", "รายได้ค่าบริหารงาน", "รายได้เงินปันผล", "เงินปันผลรับ", "กำไรจากอัตราแลกเปลี่ยน"]

cash_flow:                      # ชีต CF — ใช้ค่าเสื่อมราคาสำหรับสูตร SET (ต้นทุน = ต้นทุน + ค่าเสื่อม)
  depreciation:
    match: prefix
    required: false
    sum: true
    aliases:
      - "ค่าเสื่อมราคาและค่าตัดจำหน่าย"
      - "ค่าเสื่อมราคา"
      - "ค่าตัดจำหน่ายสินทรัพย์ไม่มีตัวตน"
      - "ค่าตัดจำหน่ายสิทธิการเช่า"
      - "ค่าตัดจำหน่ายสินทรัพย์สิทธิการใช้"
    exclude:                   # ตัดบรรทัดที่ไม่ใช่ค่าเสื่อมสินทรัพย์ดำเนินงาน
      - "หุ้นกู้"
      - "ออกหุ้นกู้"
      - "ค่าใช้จ่ายในการออก"
      - "ขาดทุนจากการตัดจำหน่าย"

balance_sheet:                  # ชีต BS
  trade_receivables:
    match: prefix
    required: true
    aliases: ["ลูกหนี้การค้าและลูกหนี้หมุนเวียนอื่น", "ลูกหนี้การค้าและลูกหนี้อื่น", "ลูกหนี้การค้า"]
  inventory:
    match: prefix
    required: true
    aliases: ["สินค้าคงเหลือ"]
  trade_payables:
    match: prefix
    required: true
    aliases: ["เจ้าหนี้การค้าและเจ้าหนี้หมุนเวียนอื่น", "เจ้าหนี้การค้าและเจ้าหนี้อื่น", "เจ้าหนี้การค้า"]
  trade_payables_broad:        # เจ้าหนี้แบบกว้างตามสูตร SET (ใช้กับ DPO ฐาน SET/เว็บ)
    match: prefix
    required: false
    sum: true
    aliases:
      - "เจ้าหนี้การค้าและเจ้าหนี้หมุนเวียนอื่น"
      - "เจ้าหนี้การค้าและเจ้าหนี้อื่น"
      - "หนี้สินที่เกิดจากสัญญา"
      - "ค่าเช่ารับล่วงหน้า"
      - "หนี้สินตามสัญญาเช่าส่วนที่ถึงกำหนดชำระภายในหนึ่งปี"
      - "ค่าใช้จ่ายค้างจ่าย"
      - "หนี้สินภายใต้สัญญาและใบอนุญาต"
      - "หนี้สินหมุนเวียนอื่น"
  total_assets:
    match: exact
    required: true
    aliases: ["รวมสินทรัพย์"]
  total_liabilities:           # ใช้ตรวจ balance check
    match: exact
    required: true
    aliases: ["รวมหนี้สิน"]
  total_equity:
    match: exact
    required: true
    aliases: ["รวมส่วนของผู้ถือหุ้น", "ส่วนของเจ้าของรวม", "รวมส่วนของเจ้าของ"]
